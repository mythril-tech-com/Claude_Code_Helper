# Publishes the extension when a version tag like v0.1.1 is pushed.
# VS Code Marketplace: Trusted Publishing (OIDC), no token stored.
# Open VSX: only when the OVSX_PAT repository secret is set.
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npx --yes @vscode/vsce@4.1.0 package

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath *.vsix --oidc

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.3.0 publish --packagePath *.vsix --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Install from the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=mythriltech.claude-code-add-to-chat), or download the \`.vsix\` below."
            echo
            awk -v v="$version" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md
